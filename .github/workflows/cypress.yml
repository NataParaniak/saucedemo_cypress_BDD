name: Cypress UI Tests

on:
  push:
    branches: [master, main, API-PR]
  pull_request:
    branches: [master, main, API-PR]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Run Cucumber UI Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI Smoke Tests
        run: npm run test:ui:smoke

